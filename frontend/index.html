<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Design Generator Agent</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🏠 AI Image Design Generator Agent</h1>
    <p class="subtitle">Describe your room, and let the AI Agent design it for you.</p>

    <form id="designForm">
      <label for="designType">Design Type</label>
      <select id="designType">
        <option value="Bedroom">Bedroom</option>
        <option value="Living Room">Living Room</option>
        <option value="Kitchen">Kitchen</option>
        <option value="Office">Office</option>
      </select>

      <div class="row">
        <div>
          <label for="roomWidth">Room Width (feet)</label>
          <input type="number" id="roomWidth" placeholder="e.g. 10" required>
        </div>
        <div>
          <label for="roomLength">Room Length (feet)</label>
          <input type="number" id="roomLength" placeholder="e.g. 12" required>
        </div>
      </div>

      <label for="items">Items needed (comma-separated)</label>
      <input type="text" id="items" placeholder="Bed, Wardrobe, Study Table, Chair" required>

      <button type="submit">✨ Generate Design</button>
    </form>

    <p id="status"></p>

    <div id="resultBox" class="hidden">
      <h2>Generated Design</h2>
      <img id="resultImage" src="" alt="Generated design image">
      <p id="promptText" class="prompt"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
